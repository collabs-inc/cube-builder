name: Verify
on:
  push:
  pull_request:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:public
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=moderate
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm run test:browser
        timeout-minutes: 5
        env:
          BUILDER_BROWSER_DRIVER: playwright
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
